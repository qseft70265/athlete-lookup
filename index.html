
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>選手報名查詢系統</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8f8f8;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 1rem;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f1f1f1;
    }
    p {
      margin: 0.3rem 0;
    }
  </style>
  <script>
    let data = [];

    async function fetchData() {
      const res = await fetch("https://docs.google.com/spreadsheets/d/1p8l_Ium_N8xeOXMSm3Ypj64Gs-LX1Efb2DDvUygMmBM/gviz/tq?tqx=out:json");
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const cols = json.table.cols.map(col => col.label);
      data = json.table.rows.map(row =>
        Object.fromEntries(row.c.map((cell, i) => [cols[i], cell ? cell.v : ""]))
      );
    }

    function search() {
      const name = document.getElementById("nameInput").value.trim();
      const output = document.getElementById("result");

      if (!name) {
        output.innerHTML = "<p>請輸入姓名</p>";
        return;
      }

      const matches = data.filter(entry =>
        entry["參賽選手姓名"] && entry["參賽選手姓名"].includes(name)
      );

      if (matches.length > 0) {
        output.innerHTML = matches.map(entry =>
          Object.entries(entry).map(([k, v]) =>
            `<p><strong>${k}</strong>: ${v}</p>`).join("")
        ).join("<hr/>");
      } else {
        output.innerHTML = "<p>查無資料</p>";
      }
    }

    window.onload = fetchData;
  </script>
</head>
<body>
  <div class="container">
    <h1>選手報名查詢系統（Google Sheet 串接）</h1>
    <input id="nameInput" placeholder="請輸入選手姓名（可輸入部分）" />
    <button onclick="search()">查詢</button>
    <div id="result"></div>
  </div>
</body>
</html>
